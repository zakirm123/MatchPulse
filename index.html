<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchPulse - Premier League</title>
    <!-- CRITICAL: Make sure this file name matches your CSS file exactly -->

<body>
    <header>
        <div class="header-content">
            <h1>🏆 MatchPulse</h1>

        </div>

    </footer>

    <script src="app.js"></script>
